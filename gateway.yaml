gateway:
  port: 8080
  routes:
    - path: "/api/users"
      methods: ["GET", "POST"]
      strip_prefix: false
      upstream:
        url: "http://localhost:3001"
    - path: "/api/products"
      methods: ["GET"]
      strip_prefix: true
      upstream:
        targets:
          - url: "http://localhost:3003"
            weight: 3
          - url: "http://localhost:3004"
            weight: 1
        balance: "weighted_round_robin"
