gateway:
  port: 8080
  global_rate_limit:
    requests: 100
    window: "60s"
    strategy: "fixed_window"
    per: "ip"
  routes:
    - path: "/api/users"
      methods: ["GET", "POST"]
      strip_prefix: false
      upstream:
        url: "http://localhost:3001"
      rate_limit:
        requests: 30
        window: "60s"
        strategy: "sliding_window"
        per: "ip"
    - path: "/api/products"
      methods: ["GET"]
      strip_prefix: true
      upstream:
        targets:
          - url: "http://localhost:3003"
            weight: 3
          - url: "http://localhost:3004"
            weight: 1
        balance: "weighted_round_robin"
      timeout: "10s"
      health_check:
        path: "/healthz"
        interval: "30s"
        unhealthy_threshold: 3
